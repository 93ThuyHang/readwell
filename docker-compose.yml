services:
  db:
    image: postgres:16-alpine
    container_name: readwell-db
    environment:
      POSTGRES_DB: readwell
      POSTGRES_USER: readwell
      POSTGRES_PASSWORD: readwell123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - readwell-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: readwell-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://readwell:readwell123@db:5432/readwell
      JWT_SECRET: readwell-admin-secret-change-in-production
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
    networks:
      - readwell-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: readwell-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    networks:
      - readwell-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  readwell-net:
    driver: bridge
